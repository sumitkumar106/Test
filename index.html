<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Bus Stand Manager - Manage bus routes and schedules">
    <meta name="theme-color" content="#333333">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">

    <title>Bus Stand Manager - Your Route, Your Way</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚌</text></svg>">

    <!-- Firebase SDKs from CDN (Compat version for easier integration) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-YOUR_PUBLISHER_ID" crossorigin="anonymous"></script>

    <!-- CSS Files -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- App Container -->
    <div id="app">
        <!-- Routes List Screen -->
        <div id="routes-list-screen" class="screen">
            <!-- Content will be dynamically rendered -->
        </div>

        <!-- Add Route Screen -->
        <div id="add-route-screen" class="screen hidden">
            <!-- Content will be dynamically rendered -->
        </div>

        <!-- Route Details Screen -->
        <div id="route-details-screen" class="screen hidden">
            <!-- Content will be dynamically rendered -->
        </div>

        <!-- Edit Route Screen -->
        <div id="edit-route-screen" class="screen hidden">
            <!-- Content will be dynamically rendered -->
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Modal Container -->
    <div id="modal-container"></div>

    <!-- Ad Banner Container -->
    <div id="ad-banner-container" class="ad-banner-container">
        <div class="ad-banner-placeholder">Advertisement</div>
    </div>

    <!-- Configuration -->
    <script src="config.js"></script>

    <!-- Utilities -->
    <script src="js/utils/helpers.js"></script>
    <script src="js/utils/validation.js"></script>
    <script src="js/utils/formatting.js"></script>

    <!-- Services -->
    <script src="js/services/firebase.js"></script>
    <script src="js/services/firestore.js"></script>
    <script src="js/services/gemini.js"></script>
    <script src="js/services/storage.js"></script>
    <script src="js/services/adsense.js"></script>

    <!-- Components -->
    <script src="js/components/Toast.js"></script>
    <script src="js/components/Modal.js"></script>
    <script src="js/components/RouteCard.js"></script>
    <script src="js/components/DaySelector.js"></script>
    <script src="js/components/TimePickerInput.js"></script>
    <script src="js/components/StoppageInput.js"></script>
    <script src="js/components/AdBanner.js"></script>

    <!-- Screens -->
    <script src="js/screens/RoutesListScreen.js"></script>
    <script src="js/screens/AddRouteScreen.js"></script>
    <script src="js/screens/RouteDetailsScreen.js"></script>
    <script src="js/screens/EditRouteScreen.js"></script>

    <!-- Router and Main App -->
    <script src="js/router.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
