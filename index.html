<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Comparison</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f4f4f4;
        }
        h1 {
            text-align: center;
            margin-top: 20px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>LLM Comparison</h1>
    <div style="width: 80%; margin: auto;">
        <canvas id="llmChart"></canvas>
    </div>

    <script>
        const ctx = document.getElementById('llmChart').getContext('2d');
        const llmChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['LLaMA 3', 'GPT-4', 'Gemini 1.5', 'Claude 3'],
                datasets: [{
                    label: 'Performance Score',
                    data: [85, 92, 88, 90],
                    backgroundColor: [
                        'rgba(255, 99, 132, 0.2)',
                        'rgba(54, 162, 235, 0.2)',
                        'rgba(255, 206, 86, 0.2)',
                        'rgba(75, 192, 192, 0.2)'
                    ],
                    borderColor: [
                        'rgba(255, 99, 132, 1)',
                        'rgba(54, 162, 235, 1)',
                        'rgba(255, 206, 86, 1)',
                        'rgba(75, 192, 192, 1)'
                    ],
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
    </script>
</body>
</html>
